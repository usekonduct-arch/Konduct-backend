# Render Blueprint. Secrets are marked sync: false, so Render asks for them on first deploy
# and they never live in this repo.
services:
  - type: web
    name: konduct-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      # The Firebase service-account key: paste the whole downloaded JSON file as the value.
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: ENFORCE_APP_CHECK
        value: "false"
      # The staff console's address(es), comma-separated; browsers elsewhere can't call the API.
      - key: CONSOLE_ORIGINS
        value: https://konduct-console.vercel.app
      - key: TOPUP_RETURN_URL
        value: https://konduct.com.ng/topup/done
      - key: DRIVER_CONTACT_EMAIL
        value: ops+{role}-{uid}@konduct.com.ng
      - key: BACHS_ACCOUNT_ID
        sync: false
      - key: IDENTITY_KEY
        sync: false
      - key: QR_SIGNING_KEY
        sync: false
      - key: OFFLINE_CODE_KEY
        sync: false
      - key: BACHS_API_KEY
        sync: false
      - key: BACHS_WEBHOOK_SECRETS
        sync: false
      # Optional: a Vercel deploy hook for the website. Publishing a blog post or job rebuilds the
      # static site (sitemap, Google for Jobs) within minutes. Without it, new content still shows
      # on the site but search engines see it after the next deploy.
      - key: SITE_DEPLOY_HOOK
        sync: false
      - key: JOBS_SECRET
        generateValue: true
